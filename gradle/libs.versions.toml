[libraries]

ax-core-ktx                   = { group = "androidx.core", name = "core-ktx", version.ref = "ax-core" }

kotlin-metadata-jvm           = { group = "org.jetbrains.kotlin", name = "kotlin-metadata-jvm", version.ref = "kotlin-android" }
