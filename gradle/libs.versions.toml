okio                          = { group = "com.squareup.okio", version.ref = "okio", name = "okio" }

ktx-datetime                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "ktx-datetime" }
ktx-serialization-json        = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "ktx-serialization-json" }

ktx-serialization-csv         = { group = "de.brudaswen.kotlinx.serialization", version.ref = "ktx-serialization-csv", name = "kotlinx-serialization-csv" }

dagger-hilt-android           = { group = "com.google.dagger", name = "hilt-android", version.ref = "dagger" }
dagger-hilt-android-compiler  = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "dagger" }

ktorfit                       = { group = "de.jensklingenberg.ktorfit", version.ref = "ktorfit", name = "ktorfit-lib" }
