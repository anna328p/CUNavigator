[libraries]

ax-core-ktx                   = { group = "androidx.core", version.ref = "ax-core", name = "core-ktx" }

kotlin-metadata-jvm           = { group = "org.jetbrains.kotlin", version.ref = "kotlin", name = "kotlin-metadata-jvm" }
