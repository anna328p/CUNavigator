ktorfit                       = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-lib", version.ref = "ktorfit" }
ktorfit-ksp                   = { group = "de.jensklingenberg.ktorfit", name = "ktorfit-ksp", version.ref = "ktorfit" }
ktor-serialization-ktx-json   = { group = "io.ktor", version.ref = "ktor", name = "ktor-serialization-kotlinx-json" }
ktor-client-contentNegotiation = { group = "io.ktor", version.ref = "ktor", name = "ktor-client-content-negotiation" }
