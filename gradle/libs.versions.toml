ax-room-runtime               = { group = "androidx.room", version.ref = "ax-room", name = "room-runtime" }
ax-room-compiler              = { group = "androidx.room", version.ref = "ax-room", name = "room-compiler" }
ax-room-ktx                   = { group = "androidx.room", version.ref = "ax-room", name = "room-ktx" }

ax-sqlite                     = { group = "androidx.sqlite", version.ref = "ax-sqlite", name = "sqlite" }
ax-sqlite-bundled             = { group = "androidx.sqlite", version.ref = "ax-sqlite", name = "sqlite-bundled" }

ax-activity-compose           = { group = "androidx.activity", name = "activity-compose", version.ref = "ax-activity-compose" }
ax-navigation-compose         = { group = "androidx.navigation", version.ref = "ax-navigation", name = "navigation-compose" }
ax-navigation-safeArgs-gradle = { group = "androidx.navigation", version.ref = "ax-navigation", name = "navigation-safe-args-gradle-plugin" }

ax-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", version.ref = "ax-lifecycle", name = "lifecycle-runtime-ktx" }
ax-lifecycle-viewmodel-compose= { group = "androidx.lifecycle", version.ref = "ax-lifecycle", name = "lifecycle-viewmodel-compose" }

gms-playServices-maps         = { group = "com.google.android.gms", version.ref = "play-services-maps", name = "play-services-maps" }
maps-ktx                      = { group = "com.google.maps.android", version.ref = "maps-ktx", name = "maps-ktx" }
maps-compose                  = { group = "com.google.maps.android", version.ref = "maps-compose", name = "maps-compose" }
maps-compose-utils            = { group = "com.google.maps.android", version.ref = "maps-compose", name = "maps-compose-utils" }
maps-compose-widgets          = { group = "com.google.maps.android", version.ref = "maps-compose", name = "maps-compose-widgets" }

colormath                     = { group = "com.github.ajalt.colormath", name = "colormath", version.ref = "colormath" }

rssparser                     = { group = "com.prof18.rssparser", name = "rssparser", version.ref = "rssparser" }

secretsGradlePlugin           = { group = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", name = "secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }

[plugins]
com-android-application                   = { id = "com.android.application",             version.ref = "agp" }
org-jetbrains-kotlin-android              = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
com-google-dagger-hilt-android            = { id = "com.google.dagger.hilt.android",      version.ref = "dagger" }
com-google-devtools-ksp                   = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
androidx-room                             = { id = "androidx.room",                       version.ref = "ax-room" }
androidx-navigation-safeargs-kotlin       = { id = "androidx.navigation.safeargs.kotlin", version.ref = "ax-navigation" }
org-jetbrains-kotlin-plugin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
de-jensklingenberg-ktorfit                = { id = "de.jensklingenberg.ktorfit",          version.ref = "ktorfit" }
org-jetbrains-kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",            version.ref = "jetbrains-kotlin-jvm" }
org-jetbrains-kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
secretsGradlePlugin                       = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }

[bundles]

ktor = [ "ktorfit", "ktor-client-contentNegotiation", "ktor-serialization-ktx-json", "ktor-client-logging" ]