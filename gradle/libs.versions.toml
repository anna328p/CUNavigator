ktor-client-logging           = { group = "io.ktor", version.ref = "ktor", name = "ktor-client-logging"}

slf4j-simple                  = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

ax-room-runtime               = { group = "androidx.room", name = "room-runtime", version.ref = "ax-room" }
