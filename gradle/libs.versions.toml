ktor-serialization-ktx-json   = { group = "io.ktor", version.ref = "ktor", name = "ktor-serialization-kotlinx-json" }
ktor-client-contentNegotiation= { group = "io.ktor", version.ref = "ktor", name = "ktor-client-content-negotiation" }
ktor-client-okhttp            = { group = "io.ktor", version.ref = "ktor", name = "ktor-client-okhttp"}
ktor-client-logging           = { group = "io.ktor", version.ref = "ktor", name = "ktor-client-logging"}

slf4j-simple                  = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }

ax-compose-bom                = { group = "androidx.compose", name = "compose-bom", version.ref = "ax-compose-bom" }

ax-compose-ui                 = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui" }
