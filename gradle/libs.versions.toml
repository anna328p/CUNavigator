ax-compose-ui-test-manifest   = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-test-manifest" }
ax-compose-ui-test-junit4     = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-test-junit4" }

ax-compose-material3-android  = { group = "androidx.compose.material3", version.ref = "ax-compose-material3", name = "material3-android" }
