ax-navigation-compose         = { group = "androidx.navigation", name = "navigation-compose", version.ref = "ax-navigation" }

ax-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
ax-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

ax-compose-ui                 = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui" }
ax-compose-ui-graphics        = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-graphics" }
