ax-compose-ui-tooling-preview = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-tooling-preview" }
ax-compose-ui-test-manifest   = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-test-manifest" }
ax-compose-ui-test-junit4     = { group = "androidx.compose.ui", version.ref = "ax-compose-ui", name = "ui-test-junit4" }

ax-compose-material3-android  = { group = "androidx.compose.material3", name = "material3-android", version.ref = "ax-compose-material3" }
ax-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "ax-compose-material" }

gms-playServices-maps         = { group = "com.google.android.gms",  name = "play-services-maps", version.ref = "play-services-maps" }
maps-ktx                      = { group = "com.google.maps.android", name = "maps-ktx", version.ref = "maps-ktx" }
maps-compose                  = { group = "com.google.maps.android", name = "maps-compose", version.ref = "maps-compose" }
maps-compose-utils            = { group = "com.google.maps.android", name = "maps-compose-utils", version.ref = "maps-compose" }
maps-compose-widgets          = { group = "com.google.maps.android", name = "maps-compose-widgets", version.ref = "maps-compose" }

colormath                     = { group = "com.github.ajalt.colormath", name = "colormath", version.ref = "colormath" }

rssparser                     = { group = "com.prof18.rssparser", name = "rssparser", version.ref = "rssparser" }

secretsGradlePlugin           = { group = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", name = "secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }
ax-navigation-safeArgs-gradle = { group = "androidx.navigation", name = "navigation-safe-args-gradle-plugin", version.ref = "ax-navigation" }

[plugins]
com-android-application                   = { id = "com.android.application", version.ref = "agp" }
org-jetbrains-kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin-android" }
org-jetbrains-kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin-android" }
com-google-dagger-hilt-android            = { id = "com.google.dagger.hilt.android", version.ref = "dagger" }
com-google-devtools-ksp                   = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room                             = { id = "androidx.room", version.ref = "ax-room" }
androidx-navigation-safeargs-kotlin       = { id = "androidx.navigation.safeargs.kotlin", version.ref = "ax-navigation" }
org-jetbrains-kotlin-plugin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin-android" }
de-jensklingenberg-ktorfit                = { id = "de.jensklingenberg.ktorfit", version.ref = "ktorfit" }
org-jetbrains-kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm", version.ref = "jetbrains-kotlin-jvm" }
secretsGradlePlugin                       = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secrets-gradle-plugin" }

[bundles]

ktor = [ "ktorfit", "ktor-client-contentNegotiation", "ktor-serialization-ktx-json", "ktor-client-logging" ]